<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郵便番号</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <form>
    <h1>郵便番号検索</h1>
    <input id="input" class="zipcode" type="text" value="" placeholder="例:1234567または123-4567">
    <button id="search" type="button">検索</button>
    <button id="resets" type="reset">リセット</button>
    <p class="Element">全角やハイフンありでも可能です。</p>
  </form>

  <div id="resultP-container">
    <p></p>
  </div>


  <div id="history">
    <p class="Element">履歴</p>
    <ul id="address-list">
      <li></li>
    </ul>
  </div>

  <div id="resetUl">
    <button id="clearAddressList">履歴を削除</button>
  </div>


  <script src="main.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</body>
